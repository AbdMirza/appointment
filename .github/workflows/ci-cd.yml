name: CI Code Verification

# Run checks on push or pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Verify Code and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Test Backend code compatibility
      - name: Install & Verify Backend
        run: |
          cd backend
          npm ci
          npm run build --if-present

      # Test Frontend code compatibility
      - name: Install & Verify Frontend
        run: |
          cd frontend
          npm ci
          npm run build