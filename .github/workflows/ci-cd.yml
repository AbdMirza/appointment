name: CI/CD Pipeline

# 1. Triggers: Run this pipeline on every push or pull request to the 'main' branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # =========================================================================
  # STAGE 1: Continuous Integration (CI) - Test & Verify Code
  # =========================================================================
  test:
    name: Run Tests & Check Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Test Backend
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Lint Backend
        run: |
          cd backend
          npm run lint || echo "No lint script defined yet"

      # Test Frontend
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend (Test compilation)
        run: |
          cd frontend
          npm run build

  # =========================================================================
  # STAGE 2: Build & Package (Dockerize)
  # =========================================================================
  build-and-push:
    name: Build Docker Images & Push to Registry
    needs: test # Only run this stage if the 'test' stage passes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only build/push on pushes to main

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub using secrets configured in GitHub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & Push Backend
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/appointment-backend:latest

      # Build & Push Frontend
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/appointment-frontend:latest

  # =========================================================================
  # STAGE 3: Continuous Deployment (CD) - Deploy to VPS
  # =========================================================================
  deploy:
    name: Deploy to Production Server
    needs: build-and-push # Only run if the Docker build succeeds
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to project folder on your server
            cd /app/appointment

            # Login to Docker Hub on the server
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull the new images we just built
            docker compose pull backend frontend

            # Stop current services and restart them with the new images
            docker compose up -d

            # Run backend database migrations automatically
            docker compose exec -T backend npx prisma migrate deploy

            # Clean up old/unused Docker images to save disk space
            docker image prune -f